<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-brand-custom mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">Job Application Tracker</a>
            <div class="navbar-nav ms-auto flex-row gap-3">
                <a class="nav-link" href="{{ url_for('dashboard') }}">Dashboard</a>
                <a class="nav-link" href="{{ url_for('companies') }}">Companies</a>
                <a class="nav-link" href="{{ url_for('jobs') }}">Jobs</a>
                <a class="nav-link" href="{{ url_for('applications') }}">Applications</a>
                <a class="nav-link" href="{{ url_for('contacts') }}">Contacts</a>
                <a class="nav-link" href="{{ url_for('job_match') }}">Job Match</a>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="{{ 'alert-soft-danger' if category == 'error' else 'alert-soft-success' }} mb-3">
                    {{ message }}
                </div>
            {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
